# SIP 实时分析
sip:
  analysis:
    enabled: false
    sipgrep-path: /usr/local/bin/sipgrep
    port-range: 5060-19999
    from-filter: ""
    archive-after-millis: 300000           # 5min
    force-archive-after-millis: 1200000    # 20min
    report-interval-millis: 3000           # 3s
    restart-delay-millis: 10000            # 10s
    console-log-enabled: false
    # 识别本机 IP 的正则列表，按你的部署环境替换
    local-ip-regex-list:
      - 127\.0\.0\.\d{1,3}
    inbound-prefix-group-max-length: 10
    outbound-prefix-group-max-length: 6
    unmatched-group-log-enabled: false
    definition-refresh-millis: 60000
