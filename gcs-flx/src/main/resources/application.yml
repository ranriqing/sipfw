app:
  version: 1.0.0
  name: sipfw
  log-path: /var/log

# Tomcat
server:
  tomcat:
    uri-encoding: UTF-8
    max-threads: 1000
    min-spare-threads: 30
    connection-timeout: 5000ms
  port: 18087
  servlet:
    context-path: /gcs-flx

# Logging
logging:
  config: classpath:logback-spring.xml

# GcsFlx
gcs:
  rootBase: "${user.home}/.gcs"
  logFilter:
    logPostParams: false
  fileStorage:
    rootDir: "${gcs.rootBase}/storage/"
  tempStorage:
    rootDir: "${gcs.rootBase}/temp/"
  toolsAvatar:
    rootDir: "${gcs.rootBase}/avatar/"

# GcsDev（开发环境登录白名单；留空即可）
gcs-dev:
  loginUsernameList: []
  saleUsernameList: []

# Wechat（如需微信登录，取消注释并填写你自己的凭据）
# wechat:
#   appid: ''
#   secret: ''
#   token: ''
#   aeskey: ''
#   viewId: 1001

# Spring
spring:
  main:
    allow-circular-references: true
    allow-bean-definition-overriding: true
  # 定时任务线程池
  task:
    scheduling:
      pool:
        size: 4
  # 环境 dev|test|prod
  profiles:
    active: dev
  # 引入 config 目录下的模块化配置
  config:
    import:
      - classpath:yml_config/sip-analysis.yml
      - classpath:yml_config/meta-init.yml
  # jackson时间格式化
  jackson:
    time-zone:  Asia/Shanghai # GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  servlet:
    multipart:
      max-file-size: 1024MB
      max-request-size: 1024MB
      enabled: true
  mvc:
    throw-exception-if-no-handler-found: true
    pathmatch:
      matching-strategy: ant_path_matcher
  # Jpa调用hibernate自动建表
  # 注解：@Entity @Id @GeneratedValue @SequenceGenerator @Transient 用来自动建表
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQL95Dialect
  # Mail邮件发送（按需配置；fromUser 为必填项）
  mail:
    host: '${MAIL_HOST:smtp.example.com}'
    port: ${MAIL_PORT:465}
    username: '${MAIL_USERNAME:}'
    password: '${MAIL_PASSWORD:}'
    fromUser: '${MAIL_FROM:FLX <noreply@example.com>}'
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          socketFactory:
            port: 465
            class: 'javax.net.ssl.SSLSocketFactory'
            fallback: false
  # DataSource 数据源
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      driver-class-name: org.postgresql.Driver
      url: '${DB_URL:jdbc:postgresql://localhost:5432/sipfw}'
      username: '${DB_USER:postgres}'
      password: '${DB_PASSWORD:chendou}'
      initial-size: 10
      max-active: 100
      min-idle: 10
      max-wait: 60000
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      #Oracle需要打开注释
      #validation-query: SELECT 1 FROM DUAL
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      stat-view-servlet:
        enabled: false
        url-pattern: /druid/*
        #login-username: admin
        #login-password: admin
      filters: stat,slf4j
      filter:
        slf4j:
          enabled: true
          statement-create-after-log-enabled: false
          statement-log-enabled: false
          statement-executable-sql-log-enable: true
          statement-log-error-enabled: true
          result-set-log-enabled: false
        stat:
          log-slow-sql: true
          slow-sql-millis: 1000
          merge-sql: false

# MybatisPlus
mybatis-plus:
  mapper-locations:
    - classpath*:/mapper/**/*.xml
    - classpath*:**/gcs/**/*Mapper.xml
  # 实体扫描，多个package用逗号或者分号分隔
  typeAliasesPackage: gcs.**.*.domain, gcs.**.*.bean
  global-config:
    # 数据库相关配置
    enable-sql-runner: true
    db-config:
      # 主键类型  AUTO:"数据库ID自增", INPUT:"用户输入ID", ID_WORKER:"全局唯一ID (数字类型唯一ID)", UUID:"全局唯一ID UUID";
      id-type: INPUT
      logic-delete-value: -1
      logic-not-delete-value: 0
      insert-strategy: NOT_NULL
      update-strategy: NOT_NULL
    banner: false
  # 原生配置
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

